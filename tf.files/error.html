<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Younes ALLAOUI</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#FAFAF7" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231B1C20'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='24' font-weight='700' fill='%23F5F5F2' text-anchor='middle'%3EYA%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAFAF7;
      --surface: #FFFFFF;
      --surface-2: #F2F1EC;
      --ink: #1B1C20;
      --muted: #65666E;
      --muted-2: #9A9BA2;
      --border: #E7E5DE;
      --border-strong: #D5D3CA;
      --accent: #3452D9;
      --accent-2: #1FAE6F;
      --accent-ink: #FFFFFF;
      --radius: 10px;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #15161B;
      --surface: #1B1C22;
      --surface-2: #202129;
      --ink: #F1F0EA;
      --muted: #9C9DA6;
      --muted-2: #6C6D77;
      --border: rgba(241,240,234,.10);
      --border-strong: rgba(241,240,234,.18);
      --accent: #6685FF;
      --accent-2: #34C98A;
      --accent-ink: #10121A;
      color-scheme: dark;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color .25s ease, color .25s ease;
    }
    a { color: inherit; }
    .mono { font-family: 'Geist Mono', monospace; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
    }

    /* ─── NAV ─── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(250, 250, 247, 0.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 48px); height: 64px;
    }
    :root[data-theme="dark"] nav { background: rgba(21, 22, 27, 0.86); }
    .nav-logo { font-weight: 600; font-size: 15px; text-decoration: none; letter-spacing: -0.01em; }
    .nav-right { display: flex; align-items: center; gap: 26px; }
    .nav-links { display: flex; gap: 26px; list-style: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .15s; }
    .nav-links a:hover { color: var(--ink); }
    .theme-toggle {
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border-strong);
      background: transparent; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--ink); transition: border-color .15s, background .15s; flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: var(--ink); background: var(--surface-2); }
    .theme-toggle svg { width: 16px; height: 16px; }
    .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: block; }

    @media (max-width: 640px) { .nav-links { display: none; } }

    /* ─── CONTENT ─── */
    .container {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 100px 20px 60px;
    }

    .status {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border-strong); border-radius: 999px;
      padding: 6px 14px; font-size: 12.5px; color: var(--muted);
      margin-bottom: 32px;
    }
    .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); }

    .error-code {
      font-family: 'Geist Mono', monospace;
      font-size: clamp(72px, 14vw, 128px);
      font-weight: 600; line-height: 1;
      color: var(--ink);
      letter-spacing: -2px;
      margin-bottom: 20px;
    }
    .error-code .accent { color: var(--accent); }

    .error-title {
      font-size: clamp(19px, 3vw, 24px); font-weight: 600; margin-bottom: 12px;
    }
    .error-msg {
      font-size: 15px; color: var(--muted); max-width: 400px; line-height: 1.75; margin-bottom: 36px;
    }
    .error-msg code {
      font-family: 'Geist Mono', monospace; font-size: 13px; color: var(--accent);
      background: var(--surface-2); padding: 2px 8px; border-radius: 5px;
    }

    .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      background: var(--accent); color: var(--accent-ink); text-decoration: none;
      padding: 12px 24px; border-radius: var(--radius); font-size: 14px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer;
      transition: opacity .15s, transform .15s;
    }
    .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
    .btn-outline {
      background: transparent; color: var(--ink); text-decoration: none;
      padding: 11px 22px; border-radius: var(--radius); border: 1px solid var(--border-strong);
      font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .btn-outline:hover { border-color: var(--ink); background: var(--surface-2); }

    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      text-align: center; padding: 18px 20px; font-size: 12.5px; color: var(--muted-2);
    }
    footer a { text-decoration: none; color: var(--muted-2); }
    footer a:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Younes Allaoui</a>
  <div class="nav-right">
    <ul class="nav-links">
      <li><a href="/#about">About</a></li>
      <li><a href="/#projects">Projects</a></li>
      <li><a href="/#skills">Skills</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
</nav>

<div class="container">
  <div class="status"><span class="dot"></span> Error 404</div>

  <div class="error-code">4<span class="accent">0</span>4</div>

  <h1 class="error-title">Page not found</h1>
  <p class="error-msg">
    The page you're looking for doesn't exist or has been moved.
    Check the URL or head back to <code>younesallaoui.com</code>
  </p>

  <div class="btns">
    <a href="/" class="btn-primary">Back to home</a>
    <button class="btn-outline" onclick="history.back()">Go back</button>
  </div>
</div>

<footer>&copy; <span id="year"></span> Younes ALLAOUI</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const root = document.documentElement;
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = prefersDark ? 'dark' : 'light';
  document.getElementById('themeToggle').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
</script>

</body>
</html>
